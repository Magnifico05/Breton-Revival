<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word of the Day Campaign</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Sora", sans-serif;
      }
      .poster {
        width: 8.5in;
        height: 11in;
        background: linear-gradient(
          135deg,
          #0a1628 0%,
          #1a2942 50%,
          #0f1d2e 100%
        );
        color: #f8fafc;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .poster::before {
        content: "";
        position: absolute;
        top: -100px;
        right: -100px;
        width: 300px;
        height: 300px;
        background: radial-gradient(
          circle,
          rgba(251, 191, 36, 0.2) 0%,
          transparent 70%
        );
        border-radius: 50%;
      }
      .poster::after {
        content: "";
        position: absolute;
        bottom: -150px;
        left: -100px;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(59, 130, 246, 0.1) 0%,
          transparent 70%
        );
        border-radius: 50%;
      }
      .content {
        position: relative;
        z-index: 1;
        width: 100%;
      }
      .top-icons {
        font-size: 2.5rem;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 3.2rem;
        font-weight: 700;
        margin: 20px 0;
        background: linear-gradient(135deg, #fbbf24 0%, #60a5fa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .subtitle {
        font-size: 1.5rem;
        color: #60a5fa;
        margin: 20px 0;
        font-weight: 500;
      }
      .message-box {
        background: rgba(59, 130, 246, 0.15);
        border: 3px solid rgba(251, 191, 36, 0.4);
        border-radius: 16px;
        padding: 30px;
        margin: 30px 0;
      }
      .message-box p {
        font-size: 1.2rem;
        line-height: 1.8;
        color: #e0e7ff;
        margin: 0;
      }
      .message-box .highlight {
        color: #fbbf24;
        font-weight: 600;
      }
      .message-box .sub {
        font-size: 1rem;
        color: #a8b8cf;
        margin: 15px 0 0;
      }
      .impact {
        font-size: 1.4rem;
        color: #fbbf24;
        margin: 25px 0;
        font-weight: 600;
      }
      .features {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 30px 0;
        flex-wrap: wrap;
      }
      .feature {
        font-size: 1.1rem;
        padding: 10px 15px;
        border-radius: 8px;
        background: rgba(96, 165, 250, 0.15);
        border: 1px solid rgba(96, 165, 250, 0.3);
      }
      .feature:nth-child(even) {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.3);
        color: #fbbf24;
      }
      .cta {
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        padding: 20px 40px;
        border-radius: 12px;
        margin: 30px 0;
        font-size: 1.2rem;
        font-weight: 700;
        color: #0a1628;
        display: inline-block;
      }
      .hashtags {
        margin: 30px 0;
      }
      .hashtags p {
        margin: 5px 0;
        font-size: 1.1rem;
      }
      .hashtags .tags {
        color: #60a5fa;
        font-weight: 500;
      }
      .hashtags .website {
        color: #a8b8cf;
      }
      .bottom-icons {
        font-size: 1.5rem;
        margin: 25px 0 0;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="content">
        <div class="top-icons">📚 🗣️ 📚</div>
        <h1>Word of the Day</h1>
        <p class="subtitle">Learn. Share. Revive.</p>
        <div class="message-box">
          <p>
            Every day, explore
            <span class="highlight">one new Breton word</span>
          </p>
          <p class="sub">Record it • Share it • Teach it</p>
        </div>
        <p class="impact">Small Steps. Big Impact. 🌟</p>
        <div class="features">
          <div class="feature">📱 Mobile Friendly</div>
          <div class="feature">🌍 Community Driven</div>
          <div class="feature">⏰ Just 1 Word/Day</div>
        </div>
        <div class="cta">START TODAY</div>
        <div class="hashtags">
          <p class="tags">#LearnBreton #BretonRevival</p>
          <p class="website">bretonrevival.example</p>
        </div>
        <div class="bottom-icons">🔤 Brezhoneg 🔤</div>
      </div>
    </div>
  </body>
</html>
